name: Check rule updates

on:
  schedule:
    # Every six months: 5 January and 5 July, 07:23 UTC.
    - cron: "23 7 5 1,7 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rule-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Check official rule sources and report updates
        run: node scripts/check-rule-updates.mjs --issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
